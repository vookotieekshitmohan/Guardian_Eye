<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Guardian Eye</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="app-container">
    
    <!-- Top Bar -->
    <header class="navbar">
      <div class="brand">
        <span class="brand-badge"></span>
        <span class="brand-title">Guardian Eye</span>
      </div>
      <span id="badge-status" class="status-pill status-standby">Standby</span>
    </header>

    <!-- Camera Feed Card -->
    <div class="card camera-card">
      <video id="webcam" playsinline autoplay muted></video>
      <div id="warning-banner" class="warning-overlay hidden">
        <div class="warning-content">
          <span class="warning-icon">⚠️</span>
          <span id="warning-text" class="warning-label">Attention Needed</span>
        </div>
      </div>
    </div>

    <!-- Quick Stats Grid -->
    <section class="grid-stats">
      <div class="card stat-card">
        <span class="stat-label">Speed</span>
        <div class="stat-main">
          <span id="speed-display" class="stat-value">0</span>
          <span class="stat-unit">km/h</span>
        </div>
      </div>

      <div class="card stat-card">
        <span class="stat-label">Driver State</span>
        <span id="state-display" class="stat-value text-safe">Attentive</span>
      </div>

      <div class="card stat-card">
        <span class="stat-label">Eye Ratio</span>
        <div class="stat-main">
          <span id="ear-display" class="stat-value">0.00</span>
          <span class="stat-sub">/ 0.22</span>
        </div>
      </div>

      <div class="card stat-card">
        <span class="stat-label">Head Pose</span>
        <span id="pose-display" class="stat-value">Center</span>
      </div>
    </section>

    <!-- Primary Control -->
    <button id="btn-toggle" class="btn-primary">
      <span class="btn-text">Start Monitoring</span>
    </button>

    <!-- Incident Activity Card -->
    <section class="card logs-card">
      <div class="logs-header">
        <span class="logs-title">Safety Log</span>
        <button id="btn-clear" class="btn-text-action">Clear</button>
      </div>
      <ul id="log-list" class="log-items">
        <li class="empty-log">No safety events recorded.</li>
      </ul>
    </section>

  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
